<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindScope · EEG & ML | Psychiatric disorders</title>
  <!-- Google Fonts & Font Awesome for clean typography and icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ---------- MODERN RESET / GLOBAL ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f6f9fc;
      color: #1e293b;
      line-height: 1.5;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ---------- ANIMATIONS (efficient & subtle) ---------- */
    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(24px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes glowPulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); }
      70% { box-shadow: 0 0 18px 8px rgba(56, 189, 248, 0.1); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

    .animate-up {
      animation: fadeSlideUp 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }

    /* ---------- NAVBAR (glassmorphism, sticky) ---------- */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 5%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.02);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
    }

    .logo i {
      color: #0f2b4b;
      font-size: 1.9rem;
      transition: transform 0.3s ease;
    }

    .logo:hover i {
      transform: scale(1.08) rotate(2deg);
    }

    .logo span {
      background: linear-gradient(145deg, #0b2f4e, #1d4a6e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      font-weight: 500;
    }

    .nav-links a {
      position: relative;
      padding-bottom: 6px;
      color: #1e3a5f;
      font-size: 1.05rem;
      transition: color 0.2s;
    }

    .nav-links a i {
      margin-right: 6px;
      font-size: 0.9rem;
      color: #3a6b92;
      transition: transform 0.2s;
    }

    .nav-links a:hover i {
      transform: translateX(3px);
    }

    /* animated underline */
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 2.5px;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      transition: width 0.25s ease-out;
      border-radius: 4px;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* right group (login/register) emphasis */
    .nav-right {
      display: flex;
      gap: 1.2rem;
      align-items: center;
    }

    .btn-outline {
      border: 1.5px solid #1e4a6b;
      background: transparent;
      padding: 0.5rem 1.3rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #1e4a6b;
      transition: all 0.25s;
    }

    .btn-outline i {
      margin-right: 5px;
    }

    .btn-outline:hover {
      background: #1e4a6b;
      color: white;
      border-color: #1e4a6b;
      box-shadow: 0 8px 14px -6px rgba(30, 74, 107, 0.25);
      transform: scale(0.98);
    }

    .btn-solid {
      background: #0e3347;
      border: none;
      padding: 0.5rem 1.6rem;
      border-radius: 40px;
      font-weight: 600;
      color: white;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      box-shadow: 0 6px 14px rgba(14, 51, 71, 0.15);
    }

    .btn-solid i {
      font-size: 0.9rem;
    }

    .btn-solid:hover {
      background: #1d4f6e;
      transform: translateY(-3px);
      box-shadow: 0 15px 20px -10px rgba(14, 51, 71, 0.25);
    }

    /* ---------- HERO SECTION (background image + overlay) ---------- */
    .hero {
      position: relative;
      min-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 5%;
      background-image: url('https://images.unsplash.com/photo-1559757175-5700dde675bc?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80'); 
      /* high-tech medical/EEG like image – brain / lab atmosphere, blurred for elegance */
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
      isolation: isolate;
    }

    /* soft overlay – keeps text readable, modern gradient */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 40%, rgba(6, 25, 40, 0.45), rgba(2, 18, 30, 0.7));
      backdrop-filter: blur(3px) brightness(0.98);
      -webkit-backdrop-filter: blur(3px);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 1000px;
      color: white;
      animation: fadeSlideUp 0.9s 0.1s backwards;
    }

    .hero-content h1 {
      font-size: 3.8rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -1.5px;
      margin-bottom: 1.2rem;
      text-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .hero-highlight {
      background: linear-gradient(130deg, #b3e0ff, #e2f0fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 2px 10px rgba(0,160,255,0.3);
    }

    .hero-sub {
      font-size: 1.4rem;
      font-weight: 300;
      margin-bottom: 2.5rem;
      opacity: 0.95;
      max-width: 750px;
      margin-left: auto;
      margin-right: auto;
      backdrop-filter: blur(4px);
      background: rgba(0, 0, 0, 0.2);
      padding: 0.7rem 2rem;
      border-radius: 60px;
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .hero-cta {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-hero-primary {
      background: white;
      color: #0a2a3b;
      border: none;
      padding: 1rem 2.8rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 20px 30px -10px rgba(0,0,0,0.25);
      transition: all 0.25s;
      border: 1px solid rgba(255,255,255,0.4);
    }

    .btn-hero-primary i {
      transition: transform 0.2s;
    }

    .btn-hero-primary:hover {
      background: #f0f9ff;
      transform: scale(1.02) translateY(-4px);
      box-shadow: 0 28px 30px -8px black;
    }

    .btn-hero-primary:hover i {
      transform: translateX(6px);
    }

    .btn-hero-secondary {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255,255,255,0.5);
      color: white;
      padding: 1rem 2.5rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-hero-secondary:hover {
      background: rgba(255,255,255,0.2);
      border-color: white;
      backdrop-filter: blur(16px);
      transform: translateY(-4px);
    }

    /* ---------- TRUST / PARTNER LOGO ANIMATION (subtle) ---------- */
    .floating-badge {
      margin-top: 3.5rem;
      display: flex;
      justify-content: center;
      gap: 2.8rem;
      color: rgba(255,255,255,0.8);
      font-weight: 400;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .floating-badge span {
      animation: floatSlow 5s infinite ease-in-out;
      display: inline-block;
      border-right: 1px solid rgba(255,255,255,0.2);
      padding-right: 2rem;
    }
    .floating-badge span:last-child { border-right: none; }
    .floating-badge i { margin-right: 8px; color: #99d6ff; }

    /* ---------- FEATURE CARDS (modern machine learning / EEG) ---------- */
    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2.2rem;
      padding: 5rem 5% 6rem;
      background: linear-gradient(180deg, #f1f7fc 0%, white 100%);
    }

    .feature-card {
      background: white;
      border-radius: 32px;
      padding: 2.2rem 1.8rem;
      width: 300px;
      box-shadow: 0 8px 30px rgba(0,20,50,0.04);
      transition: all 0.25s;
      border: 1px solid #ffffff;
      backdrop-filter: blur(4px);
      animation: glowPulse 6s infinite;
      transform: translateY(0);
    }

    .feature-card:hover {
      transform: translateY(-18px);
      box-shadow: 0 30px 40px -15px rgba(20, 80, 120, 0.2);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .feature-icon {
      font-size: 2.8rem;
      background: linear-gradient(145deg, #d4eafc, #f0f9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.8rem;
    }

    .feature-card h3 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.7rem;
      color: #0b2f4a;
    }

    .feature-card p {
      color: #4a5c6a;
      font-weight: 400;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 950px) {
      .navbar { flex-direction: column; gap: 1rem; }
      .nav-links { flex-wrap: wrap; justify-content: center; gap: 1.4rem; }
      .hero-content h1 { font-size: 2.8rem; }
    }
    @media (max-width: 600px) {
      .hero-content h1 { font-size: 2.2rem; }
      .hero-sub { font-size: 1.1rem; }
      .nav-right { flex-wrap: wrap; justify-content: center; }
    }

    /* ---------- PAGE MICRO INTERACTION ---------- */
    .register-highlight {
      background: rgba(14, 51, 71, 0.05);
      border-radius: 100px;
      padding: 0.2rem 0.6rem;
    }
    footer {
      background: #0b1f2c;
      color: #a0c6d9;
      padding: 2.5rem;
      text-align: center;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <!-- MODERN STICKY NAVBAR WITH HOME, ABOUT, REGISTRATION, LOGIN -->
  <nav class="navbar">
    <div class="logo">
      <i class="fas fa-brain"></i>
      <span>MindScope</span>
    </div>
    <div class="nav-links">
      <a href="{% url 'home' %}"><i class="fas fa-home"></i> Home</a>
      <a href="{% url 'view_dataset' %}"><i class="fas fa-microscope"></i> View Dataset</a>
      <a href="{% url 'prediction' %}" class="register-highlight"><i class="fas fa-pen-to-square"></i> Prediction</a>
      <a href="{% url 'logout' %}"><i class="fas fa-key"></i> Logout</a>
    </div>
    
  </nav>

  <!-- HERO SECTION with background image (EEG / psychiatric research) -->
  <section class="hero">
    <div class="hero-content">
      <h1>
        <span class="hero-highlight">Identification</span> of Major<br>Psychiatric Disorders
      </h1>
      <div class="hero-sub">
        <i class="fas fa-waveform"></i> Resting‑state EEG &nbsp;·&nbsp;  Machine Learning 
      </div>
      <p style="font-size:1.2rem; margin-bottom: 2rem; color: rgba(255,255,255,0.95); font-weight: 300; max-width: 700px; margin-left: auto; margin-right: auto;">
        Decoding brain activity with AI precision — non‑invasive, data‑driven, and clinically inspired.
      </p>
      <div class="hero-cta">
        <a href="{% url 'about' %}" class="btn-hero-primary">
          Explore research <i class="fas fa-arrow-right"></i>
        </a>
        <a href="{% url 'register' %}" class="btn-hero-secondary">
          <i class="fas fa-address-card"></i>  Early access / Registration
        </a>
      </div>
      
    </div>
  </section>
  <script>
      {% if messages %}
        {% for message in messages %}
            alert('{{ message }}')
        {% endfor %}
    {% endif %}
  </script>
 
  
  

  

  <!-- subtle micro-interaction: hover animation on logo, already in css -->
  <script>
    // smooth scroll placeholder — efficient, no heavy libraries
    (function() {
      // adds a very subtle additional animation on cards when they appear (already have animation-up)
      console.log('MindScope · modern ML/EEG index');
    })();
  </script>
</body>
</html>
